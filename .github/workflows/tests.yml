name: Python Qt and React verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-dejavu-core
      - run: python -m pip install -e '.[desktop,test]'
      - run: python -m pytest -q
      - run: python -m engine.cli schema
      - run: npm ci --prefix apps/web
      - run: node scripts/web-schema.mjs
      - run: git diff --exit-code schemas/snapshot-v2.json apps/web/src/schema.d.ts
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: python scripts/check-public.py
