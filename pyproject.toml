[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "study-platform"
version = "0.2.0"
description = "Private, source-grounded revision platform for première"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx[socks]>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openai>=2,<3", "python-docx>=1.1,<2", "PyMuPDF>=1.24,<2", "reportlab>=4,<5", "Pillow>=11,<13"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]
package = ["pyinstaller>=6,<7"]

[project.scripts]
study = "engine.cli:main"
study-desktop = "apps.desktop.main:main"

[tool.setuptools.packages.find]
include = ["engine*", "apps.desktop*", "backend*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
