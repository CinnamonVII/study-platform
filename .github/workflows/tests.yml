name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash -n scripts/fetch-status.sh
      - run: node --test scripts/notion-check.test.cjs
  contracts-and-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked -p study-domain
      - run: cargo test --locked -p study-engine --test pipeline
      - run: cargo test --locked -p study-engine --lib connectors
      - run: cargo test --locked -p study-server --test api
      - run: cargo check --locked -p study-ui --target wasm32-unknown-unknown
