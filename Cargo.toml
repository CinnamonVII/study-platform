[workspace]
members = ["crates/domain", "crates/engine", "crates/server", "crates/ui"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["chrono04"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
study-domain = { path = "crates/domain" }
study-engine = { path = "crates/engine" }
[profile.dev]
debug = 0
[profile.release]
opt-level = 2
strip = true
