name: Daily private revision pipeline
on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Europe/Paris'
    - cron: '30 7 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
    inputs:
      preview:
        type: boolean
        default: false
        description: 'List source changes only'
permissions:
  contents: read
concurrency:
  group: study-private-sync
  cancel-in-progress: false
jobs:
  daily:
    # Dedicated persistent runner on the same host/user/state as the API.
    # Never run public pull requests on this runner.
    runs-on: [self-hosted, linux, study-private]
    environment: study-private
    timeout-minutes: 45
    env:
      STUDY_STATE: ${{ vars.STUDY_STATE }}
      STUDY_CONFIG_JSON: ${{ secrets.STUDY_CONFIG_JSON }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      STUDY_CONTENT_TOKEN: ${{ secrets.STUDY_CONTENT_TOKEN }}
      PREVIEW: ${{ inputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load private configuration
        shell: bash
        run: |
          test -n "$STUDY_STATE"
          test -d "$STUDY_STATE"
          test -n "$STUDY_CONFIG_JSON"
          umask 077
          printf '%s' "$STUDY_CONFIG_JSON" > "$RUNNER_TEMP/study-config.json"
          printf 'STUDY_CONFIG=%s\n' "$RUNNER_TEMP/study-config.json" >> "$GITHUB_ENV"
      - name: Install isolated engine
        run: |
          python3 -m venv "$RUNNER_TEMP/study-venv"
          "$RUNNER_TEMP/study-venv/bin/python" -m pip install -e .
      - name: Run shared engine
        # Logs remain on the private host, never in public Actions artifacts.
        shell: bash
        run: |
          if [ "$PREVIEW" = 'true' ]; then
            "$RUNNER_TEMP/study-venv/bin/python" -m engine.cli daily --preview >> "$STUDY_STATE/runner.log" 2>&1
          else
            "$RUNNER_TEMP/study-venv/bin/python" -m engine.cli daily >> "$STUDY_STATE/runner.log" 2>&1
          fi
      - name: Remove temporary config
        if: always()
        run: rm -f "$RUNNER_TEMP/study-config.json"
      - name: Private result location
        if: always()
        run: echo 'Consulter le journal privé dans Synchronisation. Aucun contenu scolaire joint aux artifacts.' >> "$GITHUB_STEP_SUMMARY"
